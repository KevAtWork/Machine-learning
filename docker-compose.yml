services:
  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=super-secret-key-for-production-needs-to-change
      - DATABASE_URL=sqlite:///./cardiopredict.db
    volumes:
      - ./saved_models:/workspace/saved_models
      - ./graphs:/workspace/graphs
      - ./dataset:/workspace/dataset
      - ./reports:/workspace/reports
    restart: always

  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=/api/v1
    restart: always
